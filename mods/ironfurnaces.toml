id = "ironfurnaces"
kind = "native-mod"
name = "Iron Furnaces"
summary = "Furnaces of every metal, faster with each tier, with augments, factories, generators and a Rainbow Furnace. A port of Iron Furnaces to Sunrise."
description = """
An unofficial port of **Iron Furnaces** (by Qelifern, XenoMustache and Astryxion, Apache-2.0) to Sunrise's mod API. The Rust code is a rewrite; the textures, models, recipes and language files are the original mod's.

## What it adds

- **Furnaces of every tier:** copper, iron, silver, gold, diamond, emerald, obsidian, crystal, netherite, and the Million (Rainbow) Furnace, each faster than the last, plus the Heater.
- **Augments:** speed, fuel efficiency, blasting, smoking, factory (six rows at once) and generator (furnaces that make energy from fuel or food).
- **Automation:** auto input and output, a setting for each side, redstone modes. Pipes and other mods reach the furnaces through Sunrise's item and energy capabilities.
- **Furnace Transmitter and Settings Linker:** power furnaces from a distance, and copy a furnace's settings to others.
- **Furnace upgrades:** turn a placed furnace into the next tier, keeping what's inside.
- Flames, smoke, light and sounds as in the original, and a comparator signal.

## Optional

- **JEI:** the generator categories (fuels, foods, blasting) and the furnaces as catalysts.
- **GuideME:** the W guide: 41 short pages in English, Spanish and German, with 3D scenes and recipes, and every item opens its own page with W.
- **Applied Energistics 2** and **Machine Work:** AE2's crafting time estimate reads each furnace's real time per craft (tier, augments, factory rows).
"""
authors = ["Qelifern", "XenoMustache", "Astryxion", "Joeypc6"]
owners = ["Joeypc6"]
license = "Apache-2.0"
source = "https://github.com/Joeypc6/IronFurnaces-Sunrise"
icon = "icons/ironfurnaces.png"
screenshots = ["screenshots/ironfurnaces/1-furnaces.jpg", "screenshots/ironfurnaces/2-screen.jpg", "screenshots/ironfurnaces/3-guide.jpg", "screenshots/ironfurnaces/4-guide-tiers.jpg"]
categories = ["technology", "utility"]
tags = ["furnaces", "smelting", "automation", "energy", "generators"]

