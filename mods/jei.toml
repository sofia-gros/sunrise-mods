id = "jei"
kind = "native-mod"
name = "JEI"
summary = "Just Enough Items for Sunrise: item list and search, recipes and uses, the recipe window, transfer, bookmarks, and where things come from."
description = """
An unofficial port of **Just Enough Items** (by mezz, MIT) to Sunrise's mod API. It is a rewrite on Sunrise's own recipe-viewer APIs, not a copy of the Java mod.

## What it does

- **Item list and search** in the game's panel beside the inventory, with JEI's search grammar: names, `@mod`, `#tag`, `$tooltip`, `&id`, `-` to exclude, `"quoted words"` and `a | b`.
- **R / U** over any item shows its recipes or its uses; U on a station (crafting table, furnace) shows its whole category.
- **The recipe window:** a tab per category, the category's stations down the side, cycling ingredients, and the game's own tooltips.
- **"+"** moves a recipe into the open crafting grid; missing items show red.
- **Bookmarks** (A) along the side, kept between sessions.
- **Where things come from**, read from the game's data:
  - World Gen, with each ore's height graph per dimension.
  - Block Drops, for blocks that need silk touch or shears, or drop something else.
  - Mob Drops, with the mob drawn, where it spawns, its XP and its drops with their chances.
  - Chest Loot, Archaeology, Fishing, Piglin Bartering and Shearing.
  - Villager Trades, under the professions that offer them.
  - How To Get It, for what no recipe says (concrete from powder and water).

The item list matches the creative inventory: no operator items, no uncraftable potions. Other mods add their own categories with JSON files in `assets/<namespace>/jei/` or with the Rust API; see the README.

## Optional

GuideME, the shared guide library: W over an item opens its guide page.

## Known

On the Nightly this version is pinned to, some mobs drawn in the window lose faces (chicken legs) or show their body through their clothes (villagers). That is fixed in Sunrise itself (sunrise-org/sunrise#2365); JEI needs no change.
"""
authors = ["mezz", "Joeypc6"]
owners = ["Joeypc6"]
license = "MIT"
source = "https://github.com/Joeypc6/JEI-Sunrise"
icon = "icons/jei.png"
screenshots = ["screenshots/jei/1-crafting.jpg", "screenshots/jei/2-worldgen.jpg", "screenshots/jei/3-loot.jpg", "screenshots/jei/4-blockdrops.jpg", "screenshots/jei/5-mobs.jpg", "screenshots/jei/6-tinkers-casting.jpg", "screenshots/jei/7-search.jpg", "screenshots/jei/8-uses.jpg"]
categories = ["utility", "library"]
