name = "Sunrise Creatures"
summary = "EAnathos's creatures for Sunrise: birds, insects, sea life, spirits and a giant, each with a page in the creature guide."
description = """
The Sunrise Creatures series fills the world with animals and beings that each behave in their own way: butterflies and moths, fireflies, ladybugs, stick insects, dung beetles, worms and scorpions; seagulls, a vulture you can ride, flying fish and jellyfish; and sporelins, fairies, storm spirits and a cyclops. A creature guide given to every player records each one you meet in its bestiary, and Vanilla Bestiary adds Minecraft's own creatures to it.

These mods are written by EAnathos. Each is its own project with its own page; pick the ones you want. All of them need the Sunrise Creatures library, which is installed with any of them.
"""

