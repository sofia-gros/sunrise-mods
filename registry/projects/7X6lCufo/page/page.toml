name = "Better Inventory"
summary = "Sort, auto-refill, an equipment HUD, a gliding hotbar, and a pickup list."
description = """
Sort, auto-refill, an equipment HUD, a gliding hotbar, and a pickup list.

A sort button sits by your inventory and by chests, barrels, and shulker boxes. The sort key (R at first) sorts the part under the cursor by joining stacks, then lining them up by group, name, or amount, leaving the hotbar alone. It uses ordinary left clicks, so it works on servers.

When the stack in your hand runs out or a tool breaks, the next matching stack can move into that hotbar slot, quietly, with no sounds or flashes. Armor and held items can appear beside the hotbar with their wear. The hotbar itself can glide, lift the held item, and wobble. Items, experience, and arrows you pick up can list in a corner with their icon, name, and amount. Every part has its own switch.
"""
authors = ["Zekrenlight"]
license = "MIT"
homepage = "https://github.com/Zekrenlight/better-inventory"
issues = "https://github.com/Zekrenlight/better-inventory/issues"
icon = "icon.png"
categories = [
    "storage",
    "utility",
]

