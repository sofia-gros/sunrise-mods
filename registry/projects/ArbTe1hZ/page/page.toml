name = "Statistics+"
summary = "A clearer Statistics screen with tabs, search, sorting, and local snapshots."
description = """
A clearer Statistics screen with tabs, search, sorting, and local snapshots.

Statistics+ replaces the pause-menu Statistics button with a live, searchable screen. Views cover General, Items, Blocks, Mobs, Food, and Files. Search by name or id, sort by listed order, name, or value, and hide empty rows with Filled. The Mobs tab can group by kind and cycle All, Hostile, or Passive. Distance units cycle centimetres, metres, and kilometres; time units cycle ticks through days. Item, block, and food rows show icons; mobs show a spawn-egg icon when the game has one.

Optional JSON snapshots stay on this computer, under the mod data directory. Save and load them from the Files tab, or with /statsplus save and /statsplus load. Open the screen from the pause menu or /statsplus panel. It makes no network requests of its own; the only traffic is the game's ordinary request-stats command to the server you are playing on.
"""
authors = ["Zekrenlight"]
license = "MIT"
homepage = "https://github.com/Zekrenlight/statistics-plus"
issues = "https://github.com/Zekrenlight/statistics-plus/issues"
icon = "icon.png"
categories = ["utility"]

