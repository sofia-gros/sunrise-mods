name = "Motion Blur"
summary = "Smooth motion blur when you turn, run and fly."
description = """
Adds smooth motion blur to Sunrise.

- Turning, running and flying blur the world as it moves past you.
- The blur looks the same at any frame rate.
- Your hand, the hotbar and the menus always stay sharp.
- When you stand still, nothing is blurred and the mod does no work at all.

## Settings

**Options > Mods > Motion Blur > Config**

- **Motion Blur:** on or off.
- **Strength:** how strong the blur is, from 0 to 200 (100 by default).
"""
authors = ["GeorgeDev22"]
license = "MIT"
homepage = "https://github.com/GeorgeDev22/sunrise-motion-blur"
issues = "https://github.com/GeorgeDev22/sunrise-motion-blur/issues"
icon = "icon.png"
categories = ["utility"]

